<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVU</title>
    <link rel="stylesheet" href="login.css?v=20261117c" />
</head>
<body data-ready="0">
    <div class="chrome" data-drag>
        <div class="chrome-brand">
            <span class="chrome-mark">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 9.2 12 4.8l9.5 4.4L12 13.6 2.5 9.2z" />
                    <path d="M6.4 11.4v4.3c0 1.4 2.5 2.5 5.6 2.5s5.6-1.1 5.6-2.5v-4.3" />
                    <path d="M21.5 9.2v5.9" />
                    <circle cx="21.5" cy="16.2" r="1.1" />
                </svg>
            </span>
            <span class="chrome-name">SVU</span>
        </div>
        <div class="chrome-actions">
            <button class="chrome-button" type="button" data-window="minimize" aria-label="Minimize">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
            </button>
            <button class="chrome-button close" type="button" data-window="close" aria-label="Close">
                <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 2.5 7 7m0-7-7 7" /></svg>
            </button>
        </div>
    </div>

    <main class="stage">
        <section class="brand-pane">
            <div class="brand-grid"></div>

            <div class="brand-content">
                <span class="brand-eyebrow">SVU SESSIONS</span>
                <h1 data-t="app.title"></h1>
                <p data-t="app.subtitle"></p>
            </div>

            <footer class="brand-footer">
                <svg class="privacy-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 3 5 6v5.2c0 4.4 2.9 8.1 7 9.8 4.1-1.7 7-5.4 7-9.8V6l-7-3z" />
                    <path d="m9.2 12 1.9 1.9 3.8-3.8" />
                </svg>
                <p data-t="login.privacy"></p>
            </footer>
        </section>

        <section class="form-pane">
            <div class="form-shell">
                <header class="form-head">
                    <h2 data-t="login.title"></h2>
                    <p data-t="login.subtitle"></p>
                </header>

                <form id="form" novalidate>
                    <label class="field">
                        <span class="field-label" data-t="login.username"></span>
                        <span class="input-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" />
                            </svg>
                            <input id="username" type="text" autocomplete="username" spellcheck="false" />
                        </span>
                    </label>

                    <label class="field">
                        <span class="field-label" data-t="login.password"></span>
                        <span class="input-wrap">
                            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                            </svg>
                            <input id="password" type="password" autocomplete="current-password" />
                            <button class="password-toggle" id="togglePassword" type="button" aria-label="">
                                <svg class="eye" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z" />
                                    <circle cx="12" cy="12" r="2.5" />
                                </svg>
                                <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M3 3l18 18M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a17.8 17.8 0 0 1-3 3.5M6.2 6.6C3.6 8.2 2 12 2 12s3.5 6 10 6a10.9 10.9 0 0 0 3.2-.5M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </span>
                    </label>

                    <div class="options">
                        <label class="check">
                            <input id="savePassword" type="checkbox" />
                            <span class="check-box" aria-hidden="true">
                                <svg viewBox="0 0 12 12"><path d="M2.6 6.1l2.2 2.3 4.7-5" /></svg>
                            </span>
                            <span data-t="login.savePassword"></span>
                        </label>
                        <label class="check">
                            <input id="autoSignIn" type="checkbox" />
                            <span class="check-box" aria-hidden="true">
                                <svg viewBox="0 0 12 12"><path d="M2.6 6.1l2.2 2.3 4.7-5" /></svg>
                            </span>
                            <span data-t="login.autoSignIn"></span>
                        </label>
                    </div>

                    <div class="error" id="error" hidden>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M12 7v6M12 16.8v.2" />
                        </svg>
                        <span id="errorText"></span>
                    </div>

                    <button class="submit" id="submit" type="submit">
                        <span class="spinner" aria-hidden="true"></span>
                        <span id="submitLabel" data-t="login.signIn"></span>
                        <svg class="submit-arrow" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14m-5-5 5 5-5 5" />
                        </svg>
                    </button>
                </form>

                <div class="form-meta">
                    <div class="footer">
                        <span class="version">v3.0.0-beta.1</span>
                        <div class="lang" role="group" aria-label="Language">
                            <button type="button" data-lang="en">English</button>
                            <button type="button" data-lang="ar">&#1575;&#1604;&#1593;&#1585;&#1576;&#1610;&#1577;</button>
                        </div>
                    </div>
                    <p class="copyright" data-t="login.copyright"></p>
                </div>
            </div>
        </section>
    </main>

    <script src="login.js?v=20261117c"></script>
</body>
</html>
